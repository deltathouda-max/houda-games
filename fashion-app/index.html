<title>ファッション・レシピ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: fitting-room — a tall "stage" with the heroine on one side, the word-input desk on the other; stacks on narrow screens */
:root {
  --bg: #f3f1f9;
  --surface: #ffffff;
  --ink: #2c2540;
  --muted: #6b6485;
  --line: #e2ddef;
  --accent: #f0457e;
  --accent-ink: #ffffff;
  --teal: #13897e;
  --stage-a: #fde8ef;
  --stage-b: #e7e2fb;
  --floor: rgba(60, 40, 80, .14);
  --warm: #ff8a5c;
  --cool: #4da3f7;
  --font-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Zen Maru Gothic", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17141e; --surface: #231e2d; --ink: #f2eef9; --muted: #aba3c2; --line: #3a3349;
    --accent: #ff6f9e; --accent-ink: #1b1020; --teal: #4fd1c1;
    --stage-a: #33263a; --stage-b: #242034; --floor: rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17141e; --surface: #231e2d; --ink: #f2eef9; --muted: #aba3c2; --line: #3a3349;
  --accent: #ff6f9e; --accent-ink: #1b1020; --teal: #4fd1c1;
  --stage-a: #33263a; --stage-b: #242034; --floor: rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-size: clamp(28px, 5vw, 40px); margin: 0; letter-spacing: .02em; line-height: 1.2; }
h1 .dot { color: var(--accent); }
header p { margin: 0; color: var(--muted); }
main { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); } }

.stage {
  position: relative; border-radius: 28px; overflow: hidden;
  background: radial-gradient(circle at 50% 38%, var(--stage-a) 0 45%, var(--stage-b) 75%);
  padding: 16px 8px 8px; display: grid; justify-items: center;
}
.stage svg { width: 100%; max-width: 340px; height: auto; display: block; }
.bubble {
  position: relative; background: var(--surface); border: 2px solid var(--ink);
  border-radius: 20px; padding: 10px 16px; font-weight: 700; margin: 0 8px 4px; max-width: 100%;
  text-wrap: pretty;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -11px; width: 18px; height: 18px;
  background: var(--surface); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
  transform: translateX(-50%) rotate(45deg);
}
.bubble.pop { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.94); } to { transform: scale(1); } }
.stage .layers { transition: opacity .2s; }

.panel { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.card > * { min-width: 0; }
.card h2 { font-size: 15px; margin: 0; color: var(--muted); letter-spacing: .08em; }
label.big { font-weight: 700; font-size: 18px; }
.ask { display: flex; gap: 10px; flex-wrap: wrap; }
.ask input {
  flex: 1 1 220px; min-width: 0; font: inherit; font-size: 20px; padding: 12px 16px;
  border-radius: 16px; border: 2px solid var(--line); background: var(--bg); color: var(--ink);
}
.ask input:focus-visible { outline: none; border-color: var(--accent); }
button { font: inherit; cursor: pointer; }
.go {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 16px;
  font-weight: 700; font-size: 20px; padding: 12px 26px; min-height: 52px;
}
.go:active { transform: translateY(1px); }
button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; }
.examples button {
  background: transparent; border: 1.5px dashed var(--line); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; font-size: 15px;
}
.examples button:hover { border-color: var(--accent); }
.tools { display: flex; gap: 10px; flex-wrap: wrap; }
.tools button {
  background: var(--bg); border: 1.5px solid var(--line); color: var(--ink);
  border-radius: 12px; padding: 8px 14px; font-size: 15px; font-weight: 700;
}
.tools button:disabled { opacity: .45; cursor: default; }

.found { font-size: 19px; line-height: 2.1; word-break: break-all; }
.found .w { border-radius: 8px; padding: 2px 4px; font-weight: 700; }
.found .w-color { box-shadow: inset 0 -0.55em 0 var(--sw); }
.found .w-item { color: var(--accent); border-bottom: 3px solid var(--accent); border-radius: 0; padding: 0 1px; }
.found .w-other { color: var(--teal); border-bottom: 3px dotted var(--teal); border-radius: 0; padding: 0 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; }

.meter { display: grid; gap: 6px; }
.bar { position: relative; height: 18px; border-radius: 999px; background: linear-gradient(90deg, var(--cool), #c9c3d6 50%, var(--warm)); }
.bar .pin {
  position: absolute; top: 50%; width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface); border: 3px solid var(--ink); transform: translate(-50%, -50%);
  transition: left .5s cubic-bezier(.3,1.4,.5,1);
}
.bar-labels { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-weight: 700; }
.note { margin: 0; font-weight: 700; text-wrap: pretty; }
.seasons { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.season {
  border-radius: 14px; border: 2px solid var(--line); padding: 8px 4px; text-align: center;
  font-weight: 700; color: var(--muted); display: grid; gap: 2px; justify-items: center;
}
.season svg { width: 30px; height: 30px; }
.season.on { border-color: var(--s); color: var(--ink); background: color-mix(in srgb, var(--s) 16%, transparent); }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; }
.reasons span { font-size: 14px; background: var(--bg); border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line); }
.wear { display: flex; flex-wrap: wrap; gap: 6px; }
.wear span { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 4px; }
.wear b { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); display: inline-block; }
.card h2.steph { font-size: 18px; color: var(--ink); letter-spacing: 0; }
.step { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--surface); font-size: 15px; margin-right: 8px; vertical-align: 1px; }
.abilities { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ab { border: 2px solid var(--line); background: var(--bg); border-radius: 18px; padding: 12px 14px; text-align: left; display: grid; gap: 2px; color: var(--ink); }
.ab b { font-size: 20px; display: flex; align-items: center; gap: 8px; }
.ab b i { width: 14px; height: 14px; border-radius: 50%; background: var(--a); display: inline-block; }
.ab small { color: var(--muted); font-size: 13px; line-height: 1.5; }
.ab[aria-pressed="true"] { border-color: var(--a); background: color-mix(in srgb, var(--a) 14%, var(--surface)); box-shadow: inset 0 0 0 2px var(--a); }
ruby rt { font-size: .5em; }
.stage::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
  background: radial-gradient(circle at 50% 58%, color-mix(in srgb, var(--a, #fff) 38%, transparent), transparent 62%); }
.stage.aura::before { opacity: 1; }
.stage > * { position: relative; }
.badge { position: absolute; left: 14px; bottom: 14px; background: var(--a); color: #fff; font-weight: 800; font-family: var(--font-display); padding: 6px 16px; border-radius: 999px; font-size: 18px; }
.show-exit { display: none; }
.spells { list-style: none; margin: 4px 0 8px; padding: 0; display: none; text-align: center; font-weight: 700; gap: 4px; }
body.show .panel { display: none; }
body.show main { grid-template-columns: minmax(0, 1fr); }
body.show .stage svg { width: auto; height: min(66vh, 640px); max-width: 100%; }
body.show .spells { display: grid; }
body.show .badge { font-size: 24px; }
body.show .stage { padding-top: 60px; }
body.show .show-exit { z-index: 3; display: block; position: absolute; top: 12px; right: 12px; background: var(--surface); color: var(--ink); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 14px; font-weight: 700; }
.mg { border-radius: 16px; padding: 12px 14px; border: 2px solid var(--line); display: grid; gap: 8px; }
.mg.main { border-color: var(--a); background: color-mix(in srgb, var(--a) 10%, var(--surface)); }
.mg-title { font-weight: 800; font-size: 18px; color: var(--ink); }
.mg-title i { color: var(--a); font-style: normal; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.others { display: grid; gap: 8px; }
.orow { display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 15px; }
.orow b { color: var(--a); }
.fine { font-size: 13px; color: var(--muted); margin: 0; }
details summary { cursor: pointer; font-weight: 700; }
.rt { overflow-x: auto; margin-top: 8px; }
.rt table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 460px; }
.rt th, .rt td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.rt th { color: var(--a); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>ファッション・レシピ<span class="dot">.</span></h1>
    <p>心のスイッチを入れる「じゅもん」で、ノアを着がえさせよう</p>
  </header>
  <main>
    <section class="stage" id="stage" aria-label="ノア">
      <button type="button" class="show-exit" id="showExit">もどる</button>
      <div class="bubble" id="bubble" aria-live="polite"></div>
      <svg id="girl" viewBox="0 0 300 505" role="img" aria-label="着がえ中の ノア"></svg>
      <ol class="spells" id="spells"></ol>
      <div class="badge" id="badge" hidden></div>
    </section>
    <div class="panel">
      <section class="card" aria-labelledby="h-step1">
        <h2 class="steph" id="h-step1"><span class="step">1</span>上げたい力を えらぶ</h2>
        <div class="abilities" id="abilities"></div>
      </section>
      <form class="card" id="form" autocomplete="off">
        <label class="big" for="say"><span class="step">2</span>レシピの じゅもんを 入れる</label>
        <div class="ask">
          <input id="say" type="text" placeholder="れい: 赤い ジャケットと スニーカー" enterkeyhint="done">
          <button class="go" type="submit">かける</button>
        </div>
        <div class="examples" id="examples" aria-label="じゅもんの れい"></div>
        <div class="tools">
          <button type="button" id="undo">ひとつ もどす</button>
          <button type="button" id="reset">はじめから</button>
          <button type="button" id="show">ショーで 見せる</button>
        </div>
      </form>
      <section class="card" aria-labelledby="h-magic">
        <h2 id="h-magic">まほうの こうか</h2>
        <div id="magic"></div>
        <p class="fine">※ 色や服から受ける感じ方は、人によってちがいます。あなたが「こうなりたい」と思って選んだことが、いちばんの まほうです。</p>
        <details><summary>まほうの レシピ(こうか表)を 見る</summary><div class="rt" id="recipe"></div></details>
      </section>
      <section class="card" aria-labelledby="h-found">
        <h2 id="h-found">じゅもんで 見つかった ことば</h2>
        <div class="found" id="found"></div>
        <div class="legend">
          <span><i style="background:#f0a3c0"></i>色</span>
          <span><i style="background:var(--accent)"></i>服の 名前</span>
          <span><i style="background:var(--teal)"></i>もよう・長さ など</span>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
/* ===================== ことば辞書 ===================== */
const kata2hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const norm = s => kata2hira(s.normalize('NFKC').toLowerCase());

const DICT = [];
function add(kind, data, keys) { keys.forEach(k => DICT.push({ k: Array.from(norm(k)), kind, ...data })); }

// いろ
const C = (name, hex, tone, keys) => add('color', { name, hex, tone }, keys);
C('あか', '#e5484d', 'warm', ['あか', '赤', 'れっど', 'まっか', '真っ赤']);
C('ピンク', '#f783ac', 'warm', ['ぴんく', 'ももいろ', '桃色']);
C('オレンジ', '#ff922b', 'warm', ['おれんじ', 'だいだい', '橙']);
C('きいろ', '#ffd43b', 'warm', ['きいろ', '黄色', 'いえろー', '黄']);
C('きみどり', '#a9e34b', 'neutral', ['きみどり', '黄緑']);
C('みどり', '#37b24d', 'cool', ['みどり', '緑', 'ぐりーん']);
C('ミント', '#8ce0c4', 'cool', ['みんと']);
C('みずいろ', '#74c0fc', 'cool', ['みずいろ', '水色', 'そらいろ', '空色', 'すかいぶるー']);
C('あお', '#3b5bdb', 'cool', ['あお', '青', 'ぶるー', 'まっさお']);
C('こん', '#25335e', 'cool', ['こんいろ', '紺色', '紺', 'ねいびー', 'こんの', 'こん色']);
C('むらさき', '#9c5bd6', 'cool', ['むらさき', '紫', 'ぱーぷる']);
C('ラベンダー', '#c5b0f0', 'cool', ['らべんだー']);
C('しろ', '#ffffff', 'neutral', ['しろ', '白', 'ほわいと', 'まっしろ', '真っ白']);
C('くろ', '#2b2a33', 'neutral', ['くろ', '黒', 'ぶらっく', 'まっくろ', '真っ黒']);
C('はいいろ', '#9aa0aa', 'neutral', ['はいいろ', '灰色', 'ぐれー', 'ねずみいろ']);
C('ちゃいろ', '#8b5a3c', 'warm', ['ちゃいろ', '茶色', 'ぶらうん']);
C('ベージュ', '#e6cfa7', 'warm', ['べーじゅ']);
C('クリーム', '#fff1b8', 'warm', ['くりーむいろ', 'くりーむ']);
C('きんいろ', '#e0ae1c', 'warm', ['きんいろ', '金色', 'ごーるど']);
C('ぎんいろ', '#c3c9d1', 'neutral', ['ぎんいろ', '銀色', 'しるばー']);
C('にじいろ', 'rainbow', 'neutral', ['にじいろ', '虹色', 'にじ', '虹', 'れいんぼー']);

// イメージのことば(ものや きせつ → いろ)
const IM = (name, hex, tone, season, keys) => add('image', { name: name + 'いろ', hex, tone, season }, keys);
add('mood', { name: 'はるっぽい いろ', hex: '#ffc9de', tone: 'warm', season: 'spring' }, ['はる', '春']);
add('mood', { name: 'なつっぽい いろ', hex: '#4cc9f0', tone: 'cool', season: 'summer' }, ['なつ', '夏']);
add('mood', { name: 'あきっぽい いろ', hex: '#d9822b', tone: 'warm', season: 'autumn' }, ['あき', '秋']);
add('mood', { name: 'ふゆっぽい いろ', hex: '#3d5a98', tone: 'cool', season: 'winter' }, ['ふゆ', '冬']);
IM('さくら', '#ffb7c9', 'warm', 'spring', ['さくら', '桜']);
IM('うみ', '#1c7ed6', 'cool', 'summer', ['うみ', '海']);
IM('そら', '#8fd0ff', 'cool', null, ['そら', '空']);
IM('もり', '#2f7d4a', 'cool', null, ['もり', '森']);
IM('ゆき', '#ffffff', 'neutral', 'winter', ['ゆき', '雪']);
IM('ゆうやけ', '#ff7b54', 'warm', 'autumn', ['ゆうやけ', '夕やけ', '夕焼け']);
IM('よぞら', '#1f2a52', 'cool', null, ['よぞら', '夜空', 'よる', '夜']);
IM('ひまわり', '#ffc300', 'warm', 'summer', ['ひまわり']);
IM('もみじ', '#d6452f', 'warm', 'autumn', ['もみじ', '紅葉']);
IM('いちご', '#e5484d', 'warm', null, ['いちご', '苺']);
IM('レモン', '#fff066', 'warm', null, ['れもん']);
IM('みかん', '#ffa21f', 'warm', null, ['みかん']);
IM('メロン', '#b2e07a', 'neutral', null, ['めろん']);
IM('ぶどう', '#7a3fa0', 'cool', null, ['ぶどう']);
IM('チョコ', '#5c3a21', 'warm', null, ['ちょこれーと', 'ちょこ']);
IM('バナナ', '#ffe066', 'warm', null, ['ばなな']);
IM('ソーダ', '#7fdbff', 'cool', null, ['そーだ']);
IM('もも', '#ffb3c1', 'warm', null, ['もも', '桃']);

// きもちの ことば(いろの なまえが ないときに つかう)
const MD = (name, hex, tone, keys) => add('mood', { name, hex, tone }, keys);
MD('あたたかい いろ', '#ff8a65', 'warm', ['あたたかい', 'あったかい', 'ぽかぽか', '暖かい', '温かい']);
MD('すずしい いろ', '#74c0fc', 'cool', ['すずしい', 'さわやか', 'ひんやり', '涼しい']);
MD('かわいい いろ', '#f783ac', 'warm', ['かわいい', '可愛い']);
MD('かっこいい いろ', '#2b2a33', 'neutral', ['かっこいい', 'かっこよい', 'くーる']);
MD('おとなっぽい いろ', '#25335e', 'cool', ['おとなっぽい', 'おとなっぽく']);
MD('げんきな いろ', '#ffd43b', 'warm', ['げんき', '元気']);
MD('やさしい いろ', '#ffd6e0', 'warm', ['やさしい', '優しい']);

// いろの こさ
add('mod', { mod: 'light', label: 'うすい' }, ['うすい', '薄い', 'ぱすてる', 'あわい', '淡い']);
add('mod', { mod: 'dark', label: 'こい' }, ['こい', '濃い', 'くらい', '暗い', 'ふかい']);
add('mod', { mod: 'bright', label: 'あかるい' }, ['あかるい', '明るい']);

// ふく
const IT = (slot, type, name, extra, keys) => add('item', { slot, type, name, ...extra }, keys);
const W = { hex: '#ffffff', tone: 'neutral', name: 'しろ' };
IT('top', 'tshirt', 'Tシャツ', { sleeve: 'short', def: W }, ['てぃーしゃつ', 'tしゃつ', 'てぃしゃつ']);
IT('top', 'shirt', 'シャツ', { sleeve: 'long', def: W }, ['しゃつ', 'わいしゃつ', 'ぶらうす']);
IT('top', 'sweater', 'セーター', { sleeve: 'long', def: { hex: '#e6cfa7', tone: 'warm', name: 'ベージュ' } }, ['せーたー', 'にっと']);
IT('top', 'hoodie', 'パーカー', { sleeve: 'long', def: { hex: '#9aa0aa', tone: 'neutral', name: 'はいいろ' } }, ['ぱーかー', 'とれーなー']);
IT('top', 'tank', 'タンクトップ', { sleeve: 'none', def: W }, ['たんくとっぷ', 'きゃみそーる', 'きゃみ']);
IT('onepiece', 'dress', 'ワンピース', { sleeve: 'short', def: { hex: '#f783ac', tone: 'warm', name: 'ピンク' } }, ['わんぴーす', 'わんぴ', 'どれす']);
IT('onepiece', 'yukata', 'ゆかた', { sleeve: 'wide', def: { hex: '#3d5a98', tone: 'cool', name: 'こん' } }, ['ゆかた', '浴衣', 'きもの', '着物']);
IT('bottom', 'skirt', 'スカート', { def: { hex: '#25335e', tone: 'cool', name: 'こん' } }, ['すかーと']);
IT('bottom', 'pants', 'ズボン', { def: { hex: '#4a6fa5', tone: 'cool', name: 'あお' } }, ['ずぼん', 'ぱんつ', 'じーんず', 'じーぱん', 'すらっくす']);
IT('bottom', 'shorts', 'はんズボン', { def: { hex: '#4a6fa5', tone: 'cool', name: 'あお' } }, ['はんずぼん', '半ずぼん', 'たんぱん', '短ぱん', '短パン', 'しょーとぱんつ', 'はーふぱんつ']);
IT('outer', 'coat', 'コート', { def: { hex: '#e6cfa7', tone: 'warm', name: 'ベージュ' } }, ['こーと', 'だうん', 'だっふる']);
IT('outer', 'jacket', 'ジャケット', { def: { hex: '#25335e', tone: 'cool', name: 'こん' } }, ['じゃけっと', 'じゃんぱー', 'ぶるぞん']);

DICT.sort((a, b) => b.k.length - a.k.length);

/* ===================== ことばを みつける ===================== */
function scan(text) {
  const chars = Array.from(text);
  const ns = [], map = [];
  chars.forEach((c, i) => { Array.from(norm(c)).forEach(n => { ns.push(n); map.push(i); }); });
  const tokens = [];
  let i = 0;
  while (i < ns.length) {
    let hit = null;
    for (const e of DICT) {
      const L = e.k.length;
      if (i + L > ns.length) continue;
      let ok = true;
      for (let j = 0; j < L; j++) if (ns[i + j] !== e.k[j]) { ok = false; break; }
      if (ok) { hit = e; break; }
    }
    if (hit) {
      tokens.push({ e: hit, start: map[i], end: map[i + hit.k.length - 1] + 1 });
      i += hit.k.length;
    } else i++;
  }
  return { chars, tokens };
}

const newAttrs = () => ({ colors: [], mood: null, mods: [], pattern: null, patternLabel: '', sleeve: null, length: null, frill: false, labels: [] });
const hasAttrs = a => a.colors.length || a.mood || a.pattern || a.sleeve || a.length || a.frill || a.mods.length;

function parse(text) {
  const { chars, tokens } = scan(text);
  const items = [];
  let a = newAttrs(), remove = false;
  for (const t of tokens) {
    const e = t.e;
    if (e.kind === 'color' || e.kind === 'image') a.colors.push({ hex: e.hex, tone: e.tone, name: e.name, season: e.season || null });
    else if (e.kind === 'mood') a.mood = { hex: e.hex, tone: e.tone, name: e.name, season: e.season || null };
    else if (e.kind === 'mod') a.mods.push(e);
    else if (e.kind === 'pattern') { a.pattern = e.p; a.patternLabel = e.label; }
    else if (e.kind === 'feat') { a[e.f] = e.v; a.labels.push(e.label); }
    else if (e.kind === 'remove') remove = true;
    else if (e.kind === 'item') { items.push({ e, a }); a = newAttrs(); }
  }
  let loose = null;
  if (hasAttrs(a)) {
    if (items.length) {
      const last = items[items.length - 1].a;
      if (!last.colors.length) last.colors = a.colors;
      if (!last.mood) last.mood = a.mood;
      if (!last.mods.length) last.mods = a.mods;
      if (!last.pattern) { last.pattern = a.pattern; last.patternLabel = a.patternLabel; }
      ['sleeve', 'length'].forEach(k => { if (!last[k]) last[k] = a[k]; });
      last.frill = last.frill || a.frill;
      last.labels = last.labels.concat(a.labels);
    } else loose = a;
  }
  return { chars, tokens, items, loose, remove };
}

const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgb2hex = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const mix = (h, t, r) => { const a = hex2rgb(h), b = hex2rgb(t); return rgb2hex(a.map((v, i) => v + (b[i] - v) * r)); };
const lum = h => { const [r, g, b] = hex2rgb(h); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
function applyMods(hex, mods) {
  mods.forEach(m => {
    if (m.mod === 'light') hex = mix(hex, '#ffffff', 0.45);
    if (m.mod === 'dark') hex = mix(hex, '#000000', 0.35);
    if (m.mod === 'bright') hex = mix(hex, '#ffffff', 0.2);
  });
  return hex;
}
function autoMotif(base, p) {
  if (p === 'stars') return lum(base) > 0.7 ? '#f5b700' : '#ffe066';
  if (lum(base) > 0.78) return p === 'check' ? '#e5484d' : '#f06595';
  return '#ffffff';
}

/* ===================== ふくを つくる ===================== */
function makeGarment(e, a, prev) {
  const prevColor = prev && prev.type === e.type ? { hex: prev.color, tone: prev.tone, name: prev.colorName, season: null, kept: true } : null;
  const moodColor = a.mood && e.type !== 'straw' ? a.mood : null;
  let c1 = a.colors[0] || moodColor || prevColor || e.def;
  let pattern = a.pattern;
  let base = c1.hex;
  if (base === 'rainbow') { base = '#ffffff'; pattern = 'rainbow'; }
  base = applyMods(base, a.mods);
  const c2 = a.colors[1];
  if (!pattern && c2) pattern = 'stripes';
  if (!pattern && !a.colors.length && !a.mood && prev && prev.type === e.type) pattern = prev.pattern;
  let motif = c2 ? applyMods(c2.hex === 'rainbow' ? '#f06595' : c2.hex, a.mods) : (prev && !a.colors.length && prev.pattern === pattern ? prev.motif : autoMotif(base, pattern));
  const modLabel = a.mods.map(m => m.label).join('');
  const g = {
    base: { slot: e.slot, type: e.type, name: e.name, sleeve: e.sleeve, def: e.def },
    slot: e.slot, type: e.type, name: e.name,
    color: base, motif, pattern,
    patternLabel: a.pattern ? a.patternLabel : (pattern === 'rainbow' ? '' : (pattern === 'stripes' && c2 ? 'しましま' : (prev && pattern === prev.pattern ? prev.patternLabel : ''))),
    tone: c1.tone,
    colorName: (modLabel ? modLabel + ' ' : '') + c1.name + (c2 ? 'と' + c2.name : ''),
    sleeve: a.sleeve || (prev && prev.type === e.type && !a.sleeve ? prev.sleeve : e.sleeve),
    length: a.length || (prev && prev.type === e.type ? prev.length : 'normal'),
    frill: a.frill || (prev && prev.type === e.type && !hasAttrs(a) ? prev.frill : false),
    seasons: a.colors.concat(a.mood ? [a.mood] : []).map(c => c.season).filter(Boolean),
    feats: a.labels.slice()
  };
  if (g.type === 'yukata') g.sleeve = 'wide';
  if (g.type === 'tank') g.sleeve = 'none';
  return g;
}
function describe(g) {
  const parts = [g.colorName + 'の'];
  if (g.patternLabel) parts.push(g.patternLabel + 'の');
  if (g.feats.length) parts.push(g.feats.join(' '));
  parts.push(g.name);
  return parts.join(' ');
}

const DEF = {
  hair: { slot: 'hair', type: 'hair', name: 'かみのけ', color: '#6b4232', tone: 'warm', colorName: 'ちゃいろ', seasons: [], feats: [] },

function mk(type, extra) {
  const e = DICT.find(d => d.kind === 'item' && d.type === type);
  const a = newAttrs();
  if (extra) a.colors.push(extra);
  return makeGarment(e, a, null);
}
function startOutfit() {
  return {
    hair: { ...DEF.hair, base: { slot: 'hair', type: 'hair', name: 'かみのけ', def: { hex: '#6b4232', tone: 'warm', name: 'ちゃいろ' } } },
    top: mk('tshirt'),

}

const REMOVABLE = ['outer', 'hat', 'ribbon', 'scarf', 'bag', 'socks', 'shoes'];
function apply(outfit, parsed) {
  const o = JSON.parse(JSON.stringify(outfit));
  const done = [], removed = [];
  for (const { e, a } of parsed.items) {
    if (parsed.remove && !hasAttrs(a) && REMOVABLE.includes(e.slot)) {
      if (o[e.slot]) { removed.push(o[e.slot].name); o[e.slot] = null; }
      continue;
    }
    const prev = o[e.slot];
    const g = makeGarment(e, a, prev);
    if (e.slot === 'onepiece') { o.onepiece = g; o.top = null; o.bottom = null; }
    else if (e.slot === 'top' || e.slot === 'bottom') {
      o[e.slot] = g;
      if (o.onepiece) {
        o.onepiece = null;
        if (!o.top) o.top = mk('tshirt');
        if (!o.bottom) o.bottom = mk('skirt', { hex: '#25335e', tone: 'cool', name: 'こん' });
      }
    } else o[e.slot] = g;
    done.push(g);
  }
  if (parsed.loose) {
    const slot = o.onepiece ? 'onepiece' : 'top';
    const g = makeGarment(o[slot].base, parsed.loose, o[slot]);
    o[slot] = g;
    done.push(g);
  }
  return { outfit: o, done, removed };
}

      `<path d="M127 474 L147 474 M153 474 L173 474" stroke="${fill}" stroke-width="6" stroke-linecap="round"/>`;

  let s = `<rect x="116" y="466" width="33" height="22" rx="10" fill="${fill}" ${st()}/><rect x="151" y="466" width="33" height="22" rx="10" fill="${fill}" ${st()}/>`;
  if (g.type === 'sneakers') s += `<path d="M118 483 L147 483 M153 483 L182 483" ${st(1.6)}/><path d="M128 472 L138 472 M162 472 L172 472" ${st(1.4)}/>`;
  return s;
}
function drawHat(g, fill) {
  switch (g.type) {
    case 'straw': return path([['M', 108, 64], ['Q', 110, 18, 150, 16], ['Q', 190, 18, 192, 64], ['Z']], fill) +
      `<ellipse cx="150" cy="66" rx="98" ry="18" fill="${fill}" ${st()}/>` + path([['M', 108, 64], ['Q', 110, 18, 150, 16], ['Q', 190, 18, 192, 64], ['Z']], fill) +
      `<path d="M110 52 Q150 60 190 52 L191 62 Q150 70 109 62 Z" fill="${g.pattern ? g.motif : '#e5484d'}" ${st(1.6)}/>`;
    case 'beanie': return path([['M', 84, 94], ['Q', 84, 28, 150, 26], ['Q', 216, 28, 216, 94], ['Z']], fill) +
      `<rect x="80" y="78" width="140" height="22" rx="10" fill="${fill}" ${st()}/><circle cx="150" cy="24" r="14" fill="${fill}" ${st()}/>`;
    case 'cap': return path([['M', 150, 84], ['Q', 222, 76, 240, 92], ['Q', 200, 100, 150, 92], ['Z']], fill) +
      path([['M', 90, 88], ['Q', 92, 30, 150, 28], ['Q', 208, 30, 210, 88], ['Z']], fill) + `<circle cx="150" cy="30" r="4" fill="${fill}" ${st(1.4)}/>`;
    case 'beret': return `<ellipse cx="140" cy="56" rx="72" ry="26" transform="rotate(-8 140 56)" fill="${fill}" ${st()}/><path d="M150 32 L152 22" ${st(3)}/>`;
    default: return path([['M', 100, 76], ['Q', 104, 24, 150, 22], ['Q', 196, 24, 200, 76], ['Z']], fill) +
      path([['M', 80, 82], ['Q', 150, 58, 220, 82], ['Q', 150, 102, 80, 82], ['Z']], fill);
  }
}
function drawRibbon(g, fill) {
  if (g.type === 'headband') return `<path d="M86 104 Q88 36 150 34 Q212 36 214 104" fill="none" stroke="${LINE}" stroke-width="13" stroke-linecap="round"/><path d="M86 104 Q88 36 150 34 Q212 36 214 104" fill="none" stroke="${g.pattern ? g.motif : g.color}" stroke-width="8.5" stroke-linecap="round"/>`;
  return path([['M', 202, 66], ['L', 178, 48], ['L', 180, 84], ['Z']], fill) + path([['M', 202, 66], ['L', 226, 48], ['L', 224, 84], ['Z']], fill) + `<circle cx="202" cy="66" r="7" fill="${fill}" ${st()}/>`;
}
function drawScarf(g, fill) {
  return path([['M', 158, 200], ['L', 174, 264], ['L', 156, 268], ['L', 147, 204], ['Z']], fill) +
    `<rect x="122" y="186" width="56" height="22" rx="10" fill="${fill}" ${st()}/><path d="M158 268 L158 276 M164 266 L165 275 M170 265 L172 273" ${st(1.6)}/>`;
}
function drawBagBack(g, fill) { return g.type === 'backpack' ? `<rect x="98" y="212" width="104" height="98" rx="16" fill="${fill}" ${st()}/>` : ''; }
function drawBag(g, fill) {
  if (g.type === 'backpack') return `<rect x="119" y="206" width="9" height="78" rx="4" fill="${g.pattern ? g.motif : g.color}" ${st(1.6)}/><rect x="172" y="206" width="9" height="78" rx="4" fill="${g.pattern ? g.motif : g.color}" ${st(1.6)}/>`;
  return `<path d="M120 208 L186 290" stroke="${LINE}" stroke-width="5.5" stroke-linecap="round"/><path d="M120 208 L186 290" stroke="${g.pattern ? g.motif : g.color}" stroke-width="3" stroke-linecap="round"/>` +
    `<rect x="174" y="284" width="38" height="30" rx="9" fill="${fill}" ${st()}/><path d="M174 296 Q193 304 212 296" fill="none" ${st(1.6)}/>`;
}

function render(o) {
  let defs = '';
  const F = {};
  for (const k of Object.keys(o)) {
    const g = o[k];
    if (!g || k === 'hair') continue;
    if (g.pattern) defs += patternDef('pt-' + k, g);
    F[k] = fillOf(g, 'pt-' + k);
  }
  const hair = o.hair.color;
  let s = `<defs>${defs}</defs>`;
  s += `<ellipse cx="150" cy="492" rx="78" ry="10" style="fill:var(--floor)"/>`;
  // うしろの かみ
  s += path([['M', 84, 110], ['Q', 70, 192, 96, 208], ['L', 204, 208], ['Q', 230, 192, 216, 110], ['Z']], hair);
  if (o.bag) s += drawBagBack(o.bag, F.bag);
  // あし・うで・くび
  s += `<rect x="128" y="292" width="18" height="182" rx="8" fill="${SKIN}" ${st()}/><rect x="154" y="292" width="18" height="182" rx="8" fill="${SKIN}" ${st()}/>`;
  if (o.socks) s += o.socks.type === 'tights'
    ? `<rect x="128" y="300" width="18" height="174" rx="8" fill="${F.socks}" ${st()}/><rect x="154" y="300" width="18" height="174" rx="8" fill="${F.socks}" ${st()}/>`
    : `<rect x="128" y="440" width="18" height="34" rx="6" fill="${F.socks}" ${st()}/><rect x="154" y="440" width="18" height="34" rx="6" fill="${F.socks}" ${st()}/>`;
  if (o.shoes) s += drawShoes(o.shoes, F.shoes);
  else s += `<ellipse cx="137" cy="479" rx="12" ry="8" fill="${SKIN}" ${st()}/><ellipse cx="163" cy="479" rx="12" ry="8" fill="${SKIN}" ${st()}/>`;
  s += both([['M', 114, 208], ['L', 96, 312], ['L', 110, 315], ['L', 126, 222], ['Z']], SKIN);
  s += `<rect x="143" y="174" width="14" height="36" rx="5" fill="${SKIN}" ${st()}/>`;
  s += path([['M', 112, 206], ['Q', 150, 214, 188, 206], ['L', 182, 292], ['L', 118, 292], ['Z']], SKIN);
  // ふく
  if (o.onepiece) s += drawOnepiece(o.onepiece, F.onepiece);
  else { if (o.bottom) s += drawBottom(o.bottom, F.bottom); if (o.top) s += drawTop(o.top, F.top); }
  if (o.outer) s += drawOuter(o.outer, F.outer);
  if (o.scarf) s += drawScarf(o.scarf, F.scarf);
  if (o.bag) s += drawBag(o.bag, F.bag);
  s += `<circle cx="102" cy="321" r="9" fill="${SKIN}" ${st()}/><circle cx="198" cy="321" r="9" fill="${SKIN}" ${st()}/>`;
  // かお
  s += `<circle cx="150" cy="118" r="66" fill="${SKIN}" ${st()}/>`;
  s += `<ellipse cx="126" cy="128" rx="8.5" ry="11.5" fill="#3b2a3a"/><ellipse cx="174" cy="128" rx="8.5" ry="11.5" fill="#3b2a3a"/>`;
  s += `<circle cx="129" cy="123" r="3.2" fill="#fff"/><circle cx="177" cy="123" r="3.2" fill="#fff"/><circle cx="124" cy="133" r="1.5" fill="#fff"/><circle cx="172" cy="133" r="1.5" fill="#fff"/>`;
  s += `<ellipse cx="111" cy="148" rx="10" ry="6" fill="#ff8fa8" opacity=".5"/><ellipse cx="189" cy="148" rx="10" ry="6" fill="#ff8fa8" opacity=".5"/>`;
  s += `<path d="M142 151 Q150 160 158 151" fill="none" ${st(2.4)}/>`;
  // まえがみ
  s += path([['M', 84, 118], ['Q', 80, 46, 150, 44], ['Q', 220, 46, 216, 118], ['Q', 206, 92, 190, 86], ['Q', 178, 98, 168, 82], ['Q', 152, 100, 140, 80], ['Q', 126, 98, 112, 84], ['Q', 96, 94, 84, 118], ['Z']], hair);
  s += both([['M', 84, 108], ['Q', 78, 160, 94, 186], ['Q', 99, 152, 100, 116], ['Z']], hair);
  s += `<path d="M112 62 Q130 52 150 52" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".35"/>`;
  if (o.ribbon) s += o.hat && o.ribbon.type === 'ribbon' ? `<g transform="translate(10 44)">${drawRibbon(o.ribbon, F.ribbon)}</g>` : (o.hat ? '' : drawRibbon(o.ribbon, F.ribbon));
  if (o.hat) s += drawHat(o.hat, F.hat);
  return s;
}

/* ===================== まほうの レシピ(こうか表) ===================== */
const ABIL = {
  yuki: { name: '勇気', ruby: '<ruby>勇気<rt>ゆうき</rt></ruby>', color: '#e8542c', say: 'ドキドキしても、一歩ふみ出せる',
    colors: '赤・オレンジ・黄色・金色', items: 'スニーカー・ブーツ・キャップ・ズボン・はんズボン・ジャケット・リュック', pats: 'しましま・星' },
  iyashi: { name: 'いやし', ruby: 'いやし', color: '#22a06b', say: 'ほっとして、まわりにも やさしくなれる',
    colors: '緑・ミント・水色・うすい色・ベージュ・茶色', items: 'カーディガン・セーター・パーカー・マフラー・ニットぼう・むぎわらぼうし・サンダル', pats: '花がら・ふわふわ' },
  shuchu: { name: '集中', ruby: '<ruby>集中<rt>しゅうちゅう</rt></ruby>', color: '#2d6ae0', say: '気持ちが落ち着いて、じっくり取り組める',
    colors: '青・こん・白・はいいろ・黒', items: 'シャツ・コート・かわぐつ', pats: 'チェック・たてじま' },
  miryoku: { name: '魅力', ruby: '<ruby>魅力<rt>みりょく</rt></ruby>', color: '#a94bd6', say: '自分らしさが キラッと光る',
    colors: 'むらさき・ピンク・ラベンダー・にじ色', items: 'ワンピース・ゆかた・スカート・リボン・カチューシャ・ベレーぼう・ぼうし・かばん・タイツ', pats: 'ハート・水玉' },
};
const TYPE_AB = {
  sneakers: 'yuki', boots: 'yuki', cap: 'yuki', pants: 'yuki', shorts: 'yuki', jacket: 'yuki', backpack: 'yuki', tank: 'yuki',
  cardigan: 'iyashi', sweater: 'iyashi', hoodie: 'iyashi', scarf: 'iyashi', beanie: 'iyashi', straw: 'iyashi', sandals: 'iyashi',
  shirt: 'shuchu', coat: 'shuchu', loafers: 'shuchu',
  dress: 'miryoku', yukata: 'miryoku', skirt: 'miryoku', ribbon: 'miryoku', headband: 'miryoku', beret: 'miryoku', hat: 'miryoku', pochette: 'miryoku', tights: 'miryoku',
};
const PAT_AB = { stripes: 'yuki', stars: 'yuki', flowers: 'iyashi', check: 'shuchu', vstripes: 'shuchu', hearts: 'miryoku', dots: 'miryoku', rainbow: 'miryoku' };

function hsl(hex) {
  const [r, g, b] = hex2rgb(hex).map(v => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (mx !== mn) {
    const d = mx - mn;
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = (g - b) / d + (g < b ? 6 : 0); else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
    h *= 60;
  }
  return { h, s, l };
}
function colorAbility(g) {
  if (g.pattern === 'rainbow') return 'miryoku';
  const { h, s, l } = hsl(g.color);
  if (s < 0.18 || l > 0.96 || l < 0.13) return 'shuchu';
  if ((h < 45 || h >= 352) && l < 0.45) return 'iyashi';
  if (h < 45 && s < 0.62 && l > 0.7) return 'iyashi';
  if (h < 65 || h >= 352) return 'yuki';
  if (h < 170) return 'iyashi';
  if (h < 250) return l > 0.7 ? 'iyashi' : 'shuchu';
  if (h < 300) return 'miryoku';
  return l > 0.85 ? 'iyashi' : 'miryoku';
}
const WEAR_ORDER = ['hat', 'ribbon', 'onepiece', 'top', 'outer', 'scarf', 'bottom', 'bag', 'socks', 'shoes'];
function magicOf(o) {
  const res = { yuki: [], iyashi: [], shuchu: [], miryoku: [] };
  const push = (k, t) => { if (k && !res[k].includes(t)) res[k].push(t); };
  WEAR_ORDER.forEach(slot => {
    const g = o[slot]; if (!g) return;
    push(colorAbility(g), `${g.colorName}の ${g.name}`);
    push(TYPE_AB[g.type], g.name);
    if (g.pattern) push(PAT_AB[g.pattern], g.pattern === 'rainbow' ? 'にじ色' : (g.patternLabel || ''));
    if (g.frill) push('iyashi', 'ふわふわ');
  });
  Object.keys(res).forEach(k => { res[k] = res[k].filter(Boolean); });
  return res;
}

/* ===================== がめん ===================== */
const $ = id => document.getElementById(id);
let state = { outfit: startOutfit(), spells: [] };
let ability = null;
let history = [];
const EXAMPLES = [
  '赤い ジャケットと スニーカー',
  'ミントの ふわふわ カーディガン',
  'こんの チェックの シャツ',
  'むらさきの 星がらの ワンピース',
  'うすい 黄色の パーカーと キャップ',
  '金色の リボン',
];
$('examples').innerHTML = EXAMPLES.map(t => `<button type="button">${t}</button>`).join('');
$('examples').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  $('say').value = b.textContent; dress(b.textContent);
});

$('abilities').innerHTML = Object.entries(ABIL).map(([k, a]) =>
  `<button type="button" class="ab" data-k="${k}" aria-pressed="false" style="--a:${a.color}"><b><i></i>${a.ruby}</b><small>${a.say}</small></button>`).join('');
$('abilities').addEventListener('click', ev => {
  const b = ev.target.closest('.ab'); if (!b) return;
  ability = b.dataset.k;
  document.querySelectorAll('.ab').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  setBubble(`${ABIL[ability].name}アップの まほうを かけよう！ レシピの じゅもんを 入れてね。`);
  refresh();
  $('say').focus({ preventScroll: true });
});

$('recipe').innerHTML = `<table><thead><tr><th scope="col">上げたい力</th><th scope="col">色</th><th scope="col">服・小物</th><th scope="col">もよう</th></tr></thead><tbody>` +
  Object.values(ABIL).map(a => `<tr style="--a:${a.color}"><th scope="row">${a.ruby}</th><td>${a.colors}</td><td>${a.items}</td><td>${a.pats}</td></tr>`).join('') + '</tbody></table>';

function setBubble(t) { const b = $('bubble'); b.textContent = t; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function showFound(p) {
  if (!p) { $('found').innerHTML = '<span style="color:var(--muted)">ここに、じゅもんで 見つかった ことばが 出るよ</span>'; return; }
  let html = '', i = 0;
  for (const t of p.tokens) {
    if (t.e.kind === 'noop') continue;
    html += escapeHtml(p.chars.slice(i, t.start).join(''));
    const w = escapeHtml(p.chars.slice(t.start, t.end).join(''));
    if (t.e.kind === 'color' || t.e.kind === 'image' || t.e.kind === 'mood') {
      const sw = t.e.hex === 'rainbow' ? '#b197fc' : (t.e.hex === '#ffffff' ? '#e9e4f5' : t.e.hex);
      html += `<span class="w w-color" style="--sw:${sw}88">${w}</span>`;
    } else if (t.e.kind === 'item') html += `<span class="w w-item">${w}</span>`;
    else html += `<span class="w w-other">${w}</span>`;
    i = t.end;
  }
  html += escapeHtml(p.chars.slice(i).join(''));
  $('found').innerHTML = html;
}

function refresh() {
  const o = state.outfit;
  $('girl').innerHTML = render(o);
  const stage = $('stage'), badge = $('badge');
  if (ability) {
    const a = ABIL[ability];
    stage.style.setProperty('--a', a.color); stage.classList.add('aura');
    badge.hidden = false; badge.style.setProperty('--a', a.color); badge.textContent = `${a.name}アップ！`;
  } else { stage.classList.remove('aura'); badge.hidden = true; }

  const m = magicOf(o);
  let html = '';
  const chips = list => `<div class="chips">${list.map(t => `<span>${escapeHtml(t)}</span>`).join('')}</div>`;
  if (ability) {
    const a = ABIL[ability], got = m[ability];
    html += `<div class="mg main" style="--a:${a.color}"><div class="mg-title"><i>${a.ruby}</i> の まほうの もと</div>` +
      (got.length
        ? `${chips(got)}<div>${got.length}こ 見つかったよ。「${a.say}」まほうが かかりそう！</div>`
        : `<div>この コーデには、あなたの 気もちが こめられているよ。どんな 思いで 選んだか、ショーで つたえてみよう！ レシピ表も 見てみてね。</div>`) + `</div>`;
  } else {
    html += `<div class="mg"><div class="mg-title">まず ① で 上げたい力を 選ぼう</div></div>`;
  }
  const rest = Object.keys(ABIL).filter(k => k !== ability && m[k].length);
  if (rest.length) {
    html += `<div class="others"><div class="fine">${ability ? 'ほかにも、こんな まほうが 入っているよ' : 'いまの コーデに 入っている まほう'}</div>` +
      rest.map(k => `<div class="orow" style="--a:${ABIL[k].color}"><b>${ABIL[k].name}</b><span>${m[k].map(escapeHtml).join('、')}</span></div>`).join('') + `</div>`;
  }
  $('magic').innerHTML = html;
  $('spells').innerHTML = state.spells.slice(-4).map(t => `<li>「${escapeHtml(t)}」</li>`).join('');
  $('undo').disabled = history.length === 0;
}

function dress(text) {
  text = text.trim();
  if (!text) { setBubble('じゅもんを 入れてね。'); return; }
  const p = parse(text);
  showFound(p);
  const r = apply(state.outfit, p);
  if (!r.done.length && !r.removed.length) {
    setBubble('うーん、その じゅもんは わからなかったよ。「赤い ジャケット」みたいに、色と 服の 名前を 入れてね。');
    return;
  }
  history.push(state); if (history.length > 30) history.shift();
  const before = ability ? magicOf(state.outfit)[ability].length : 0;
  state = { outfit: r.outfit, spells: state.spells.concat(text) };
  const msgs = [];
  if (r.done.length) msgs.push(r.done.slice(0, 3).map(describe).join('、') + ' に 着がえたよ！');
  if (r.removed.length) msgs.push(r.removed.join('と ') + 'を はずしたよ。');
  if (ability && magicOf(state.outfit)[ability].length > before) msgs.push(`${ABIL[ability].name}の まほうが 強くなった 気がする！`);
  else msgs.push(['気に入ったよ！', 'どうかな？', 'わくわくする！'][Math.floor(Math.random() * 3)]);
  setBubble(msgs.join(' '));
  refresh();
}

$('form').addEventListener('submit', ev => { ev.preventDefault(); dress($('say').value); });
$('undo').addEventListener('click', () => {
  if (!history.length) return;
  state = history.pop(); setBubble('ひとつ前に もどったよ。'); refresh();
});
$('reset').addEventListener('click', () => {
  history.push(state); state = { outfit: startOutfit(), spells: [] }; showFound(null);
  setBubble('はじめの 服に もどったよ。'); refresh();
});
$('show').addEventListener('click', () => {
  document.body.classList.add('show');
  setBubble(ability ? `${ABIL[ability].name}アップの コーデだよ。見てね！` : 'わたしの コーデ、見てね！');
  window.scrollTo({ top: 0 });
});
$('showExit').addEventListener('click', () => { document.body.classList.remove('show'); });

setBubble('こんにちは、ノアだよ！ まず 上げたい力を 選んで、レシピの じゅもんを 入れてね。');
showFound(null);
refresh();
</script>
